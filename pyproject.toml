[project]
name = "corral"
version = "0.1.0"
description = "A coding agent that runs inside a sealed, single-use sandbox and hands back changes for review."
readme = "README.md"
authors = [
    { name = "Tmwakalasya", email = "mwakalasyatuntu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.13.0",
    "textual>=8.2.8",
]

[project.scripts]
corral = "corral.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "docker: needs a running Docker daemon and the corral cell image",
]
